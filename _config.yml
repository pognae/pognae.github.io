title: MonoPoint
name: MonoPoint
description: 주식 주문부터 ETF, 절세 계좌, 가계 관리까지 재테크·투자 기초를 공식 자료와 계산 예시로 풀어 쓰는 블로그
logo: /icons/icon.svg
lang: ko-KR
locale: ko-KR
date_format: "%Y년 %m월 %d일"
timezone: Asia/Seoul
future: true
url: "https://monopoint.app"
baseurl: ""
permalink: /blog/:year/:month/:day/:slug/

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "air" # 깔끔하고 가독성 좋은 'air' 스킨 적용

author:
  name   : "MonoPoint"
  avatar : "/icons/icon.svg"
  bio    : "처음 투자하는 사람이 헷갈리는 제도와 숫자를 공식 자료 기준으로 정리합니다."
  links:
    - label: "Home"
      icon: "fas fa-fw fa-home"
      url: "https://monopoint.app"

footer:
  links:
    - label: "소개"
      url: "/about.html"
    - label: "카테고리"
      url: "/categories/"
    - label: "개인정보처리방침"
      url: "/privacy.html"
    - label: "이용약관"
      url: "/terms.html"
    - label: "문의"
      url: "/contact.html"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

paginate: 10
paginate_path: "/page:num/"

markdown: kramdown
kramdown:
  input: GFM

collections:
  preview:
    output: true
    permalink: /preview/:year/:month/:day/:slug/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .cursor
  - .agents
  - AGENTS.md
  - MEMORY.md
  - _posts-pending
  - _posts-pending-archive
  - _posts-archive
  - _preview
  - scripts
  - scratch*.js
  - adsense_dump.html
  - admin.html
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - vendor/bundle
  - .bundle

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true
      read_time: false
      comments: true
      share: true
      related: true

repository: "pognae/pognae.github.io"

comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOJxntLw"
    category_name: "Announcements"
    category_id: "DIC_kwDOJxntL84DG3Pr"
  # Waline 서버 주소(Vercel 배포 URL)를 넣으면 로그인 없는 Waline 댓글로 바뀌고, 비워 두면 giscus를 씁니다.
  waline:
    server_url: ""

