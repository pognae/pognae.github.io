title: 자취노트
name: 자취노트
description: 월세 계약, 이사, 관리비와 공과금, 장보기와 집 수리를 처음 자취하는 사람을 위해 정리하는 생활 안내
logo: /icons/icon.svg
lang: ko-KR
locale: ko-KR
date_format: "%Y년 %m월 %d일"
timezone: Asia/Seoul
future: true
url: "https://monopoint.app"
baseurl: ""
permalink: /blog/:year/:month/:day/:slug/

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "air" # 깔끔하고 가독성 좋은 'air' 스킨 적용

author:
  name   : "자취노트"
  avatar : "/icons/icon.svg"
  bio    : "처음 혼자 사는 사람이 계약·이사·살림에서 빠뜨리기 쉬운 항목을 정리합니다."
  links:
    - label: "Home"
      icon: "fas fa-fw fa-home"
      url: "https://monopoint.app"

footer:
  links:
    - label: "소개"
      url: "/about.html"
    - label: "카테고리"
      url: "/categories/"
    - label: "개인정보처리방침"
      url: "/privacy.html"
    - label: "이용약관"
      url: "/terms.html"
    - label: "문의"
      url: "/contact.html"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

paginate: 10
paginate_path: "/page:num/"

markdown: kramdown
kramdown:
  input: GFM

collections:
  preview:
    output: true
    permalink: /preview/:year/:month/:day/:slug/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .cursor
  - .agents
  - AGENTS.md
  - MEMORY.md
  - _posts-pending
  - _posts-pending-archive
  - _posts-archive
  - _preview
  - scripts
  - scratch*.js
  - adsense_dump.html
  - _admin-queue
  - _humanize-reports
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - vendor/bundle
  - .bundle

defaults:
  - scope:
      path: ""
      type: pages
    values:
      author_profile: false
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      show_date: true
      read_time: false
      comments: true
      share: true
      related: true

repository: "pognae/pognae.github.io"

comments:
  # "custom"이면 테마가 댓글 스크립트를 따로 넣지 않고 _includes/comments.html이 Waline/giscus를 고릅니다.
  provider: "custom"
  giscus:
    repo_id: "R_kgDOJxntLw"
    category_name: "Announcements"
    category_id: "DIC_kwDOJxntL84DG3Pr"
  # Waline 서버 주소(Vercel 배포 URL)를 넣으면 로그인 없는 Waline 댓글로 바뀌고, 비워 두면 giscus를 씁니다.
  waline:
    server_url: "https://monopoint-comments.vercel.app"

