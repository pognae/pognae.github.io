name: Auto Post Realtime Keywords (DISABLED)

# AdSense 저가치 콘텐츠 대응: 자동 양산 발행 영구 중단.
# 신규 글은 손으로 쓴 기둥 가이드만 _posts에 추가합니다.
# 이 워크플로는 실수로라도 돌아가지 않도록 jobs를 비워 둡니다.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse auto-post
        run: |
          echo "auto_post is disabled for content quality (AdSense)."
          echo "Write pillar guides manually under _posts/."
          exit 1
