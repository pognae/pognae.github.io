<script>
  document.addEventListener("DOMContentLoaded", function() {
    var nav = document.querySelector(".greedy-nav");
    if (nav && !document.querySelector(".jn-theme-btn")) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "jn-theme-btn";
      var paint = function () {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        btn.textContent = dark ? "라이트" : "다크";
        btn.setAttribute("aria-label", dark ? "라이트 모드로 전환" : "다크 모드로 전환");
      };
      paint();
      btn.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("jn-theme", next); } catch (e) {}
        paint();
      });
      nav.appendChild(btn);
    }

    var hub = document.querySelector(".jn-hub");
    var titleEl = document.querySelector("h1.page__title");
    var desc = document.querySelector('meta[name="description"]');
    if (!hub && titleEl && desc && desc.content && !document.querySelector(".jn-lead")) {
      var lead = desc.content.replace(/\s*[|\-]\s*자취노트\s*$/, "").trim();
      if (lead && lead !== titleEl.textContent.trim()) {
        var p = document.createElement("p");
        p.className = "jn-lead";
        p.textContent = lead;
        titleEl.insertAdjacentElement("afterend", p);
      }
    }

    function cleanTitleText(text) {
      if (!text) return "";
      return text.replace(/\*\*/g, "").replace(/\*/g, "").replace(/[`#_~]/g, "").trim().replace(/\s+/g, " ");
    }

    // Tab title
    if (document.title.includes("*")) {
      document.title = cleanTitleText(document.title);
    }

    // Page/Post title elements, list items, and paginator text
    const selectors = [
      "h1.page__title",
      ".page__title",
      ".archive__item-title a",
      ".pager-title"
    ];
    selectors.forEach(function(sel) {
      document.querySelectorAll(sel).forEach(function(el) {
        if (el.textContent.includes("*")) {
          if (el.children.length === 0) {
            el.textContent = cleanTitleText(el.textContent);
          } else {
            for (var i = 0; i < el.childNodes.length; i++) {
              var node = el.childNodes[i];
              if (node.nodeType === Node.TEXT_NODE && node.textContent.includes("*")) {
                node.textContent = cleanTitleText(node.textContent);
              }
            }
          }
        }
      });
    });
  });
</script>
<script>
  window.jnEsc = function (value) {
    return String(value).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  };
  window.jnPaper = function (title, rows, foot) {
    var sheet = document.getElementById("jn-sheet");
    if (!sheet) return;
    var html = "<h3>" + window.jnEsc(title) + "</h3>";
    html += '<p class="jn-paper-sub">자취노트 · ' + window.jnEsc(new Date().toLocaleString("ko-KR")) + "</p><table>";
    rows.forEach(function (row) {
      html += "<tr><th>" + window.jnEsc(row[0]) + "</th><td>" + row[1] + "</td></tr>";
    });
    html += '</table><p class="jn-paper-foot">' + window.jnEsc(foot) + "</p>";
    sheet.innerHTML = html;
  };
  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-jn-pdf]");
    if (!button) return;
    var sheet = document.getElementById("jn-sheet");
    if (!sheet) return;
    var label = button.textContent;
    button.disabled = true;
    button.textContent = "PDF 만드는 중";
    var host = document.createElement("div");
    host.style.cssText = "position:fixed;left:-12000px;top:0;width:720px;background:#fff;";
    var clone = sheet.cloneNode(true);
    clone.id = "";
    host.appendChild(clone);
    document.body.appendChild(host);
    function finish() {
      host.remove();
      button.disabled = false;
      button.textContent = label;
    }
    function fallback() {
      finish();
      window.print();
    }
    var src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
    var ready = window.html2pdf ? Promise.resolve() : new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
    ready.then(function () {
      return window.html2pdf().set({
        margin: [12, 12, 12, 12],
        filename: button.getAttribute("data-jn-pdf") || "자취노트.pdf",
        image: { type: "jpeg", quality: 0.96 },
        html2canvas: { scale: 2, backgroundColor: "#ffffff" },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      }).from(clone).save();
    }).then(finish).catch(fallback);
  });
</script>
